  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Touch Auger"
    id: touch_key_AUGER
    x_min: 0
    x_max: 83
    y_min: 268
    y_max: 296
    on_press:
      - if:
          condition:
            lambda: |-
              return id(cs1pot_ui_page) == 0 && !id(prime_confirm_dialog) && !id(lighting_failed_dialog);
          then:
            - script.execute: sc_toggle_auger_manual

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Touch Hotrod"
    id: touch_key_HOTROD
    x_min: 81
    x_max: 161
    y_min: 268
    y_max: 296
    on_press:
      - if:
          condition:
            lambda: |-
              return id(cs1pot_ui_page) == 0 && !id(prime_confirm_dialog) && !id(lighting_failed_dialog);
          then:
            - script.execute: sc_toggle_hotrod_manual

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Touch Prime"
    id: touch_key_PRIME
    x_min: 157
    x_max: 239
    y_min: 268
    y_max: 296
    on_press:
      - if:
          condition:
            lambda: 'return id(cs1pot_ui_page) == 0;'
          then:
            - script.execute: sc_prime_press

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    id: touch_prime_90
    x_min: 14
    x_max: 81
    y_min: 196
    y_max: 235
    on_press:
      - if:
          condition:
            lambda: 'return id(prime_confirm_dialog);'
          then:
            - script.execute:
                id: sc_prime_auger
                duration_s: 90

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    id: touch_prime_180
    x_min: 86
    x_max: 153
    y_min: 196
    y_max: 235
    on_press:
      - if:
          condition:
            lambda: 'return id(prime_confirm_dialog);'
          then:
            - script.execute:
                id: sc_prime_auger
                duration_s: 180

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    id: touch_prime_350
    x_min: 158
    x_max: 225
    y_min: 196
    y_max: 235
    on_press:
      - if:
          condition:
            lambda: 'return id(prime_confirm_dialog);'
          then:
            - script.execute:
                id: sc_prime_auger
                duration_s: 350

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    id: touch_prime_cancel
    x_min: 85
    x_max: 154
    y_min: 252
    y_max: 283
    on_press:
      - if:
          condition:
            lambda: 'return id(prime_confirm_dialog);'
          then:
            - script.execute: sc_prime_confirm_cancel

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    id: touch_key_LIGHTING_OK
    x_min: 70
    x_max: 170
    y_min: 210
    y_max: 250
    on_press:
      - if:
          condition:
            lambda: return id(lighting_failed_dialog);
          then:
            - globals.set:
                id: lighting_failed_dialog
                value: 'false'
            - lambda: id(status_msg).publish_state("Ready!");
            - logger.log: "Lighting failed dialog dismissed"
