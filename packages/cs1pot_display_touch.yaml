# Touch zones — sync with includes/cs1pot_main_cook_ui.h
binary_sensor:
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Touch Mode OFF"
    id: touch_mode_off
    x_min: 8
    x_max: 58
    y_min: 4
    y_max: 28
    on_press:
      - if:
          condition:
            lambda: |-
              return id(cs1pot_ui_page) == 0 && !id(prime_confirm_dialog) && !id(lighting_failed_dialog);
          then:
            - script.execute: sc_mode_off

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Touch Mode Heat"
    id: touch_mode_heat
    x_min: 54
    x_max: 108
    y_min: 4
    y_max: 28
    on_press:
      - if:
          condition:
            lambda: |-
              return id(cs1pot_ui_page) == 0 && !id(prime_confirm_dialog) && !id(lighting_failed_dialog);
          then:
            - script.execute:
                id: sc_request_cook_mode
                mode: "Heat"

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Touch Mode Smoke"
    id: touch_mode_smoke
    x_min: 108
    x_max: 168
    y_min: 4
    y_max: 28
    on_press:
      - if:
          condition:
            lambda: |-
              return id(cs1pot_ui_page) == 0 && !id(prime_confirm_dialog) && !id(lighting_failed_dialog);
          then:
            - script.execute:
                id: sc_request_cook_mode
                mode: "Smoke"

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Touch Settings Gear"
    id: touch_settings_gear
    x_min: 196
    x_max: 239
    y_min: 2
    y_max: 28
    on_press:
      - if:
          condition:
            lambda: |-
              return id(cs1pot_ui_page) == 0 && !id(prime_confirm_dialog) && !id(lighting_failed_dialog);
          then:
            - script.execute: sc_ui_open_settings

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Touch Settings Back"
    id: touch_settings_back
    x_min: 0
    x_max: 47
    y_min: 0
    y_max: 31
    on_press:
      - if:
          condition:
            lambda: 'return id(cs1pot_ui_page) != 0;'
          then:
            - script.execute: sc_ui_back_home

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Touch Setpoint Down"
    id: touch_key_TEMP_DOWN
    x_min: 10
    x_max: 54
    y_min: 102
    y_max: 142
    on_press:
      - if:
          condition:
            lambda: |-
              return id(cs1pot_ui_page) == 0 && !id(prime_confirm_dialog) && !id(lighting_failed_dialog);
          then:
            - globals.set:
                id: page_1_selected_option
                value: '"temp_setting"'
            - script.execute:
                id: sc_adjust_set_temp
                direction: -1

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Touch Setpoint Up"
    id: touch_key_TEMP_UP
    x_min: 186
    x_max: 230
    y_min: 102
    y_max: 142
    on_press:
      - if:
          condition:
            lambda: |-
              return id(cs1pot_ui_page) == 0 && !id(prime_confirm_dialog) && !id(lighting_failed_dialog);
          then:
            - globals.set:
                id: page_1_selected_option
                value: '"temp_setting"'
            - script.execute:
                id: sc_adjust_set_temp
                direction: 1

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Touch Smoke Pill 1"
    x_min: 21
    x_max: 58
    y_min: 150
    y_max: 180
    on_press:
      - if:
          condition:
            lambda: |-
              return id(cs1pot_ui_page) == 0 && !id(prime_confirm_dialog) && !id(lighting_failed_dialog);
          then:
            - script.execute:
