    touchscreen_id: my_touchscreen
    name: "Touch Smoke Pill 5"
    x_min: 185
    x_max: 222
    y_min: 150
    y_max: 180
    on_press:
      - if:
          condition:
            lambda: |-
              return id(cs1pot_ui_page) == 0 && !id(prime_confirm_dialog) && !id(lighting_failed_dialog);
          then:
            - script.execute:
