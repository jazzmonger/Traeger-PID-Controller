# Main-cook home screen (240x320) — Jeff mock 05-pellets-firepot
display:
  - id: !extend mydisplay
    update_interval: 250ms
    lambda: |-
      using namespace cs1pot;

      const Color bg = cook_bg();
      const Color card = cook_card();
      const Color muted = cook_muted();
      const Color amber = cook_amber();
      const Color cyan = cook_cyan();
      const Color white = cook_white();

      if (id(lighting_failed_dialog)) {
        it.filled_rectangle(0, 0, 240, 320, Color(0, 0, 0));
        it.filled_rectangle(8, 70, 224, 190, Color(30, 30, 30));
        it.rectangle(8, 70, 224, 190, Color(255, 90, 70));
        auto msg_color = ((millis() / 500) % 2 == 0) ? Color(255, 90, 70) : white;
        it.print(18, 95, id(font20), msg_color, "Lighting failed,");
        it.print(18, 120, id(font20), msg_color, "are pellets loaded?");
        it.filled_rectangle(70, 210, 100, 40, Color(0, 140, 0));
        it.rectangle(70, 210, 100, 40, white);
        it.print(100, 218, id(font20), white, "OK");
        return;
      }

      if (id(prime_confirm_dialog)) {
        it.filled_rectangle(0, 0, 240, 320, Color(0, 0, 0));
        it.filled_rectangle(8, 36, 224, 248, Color(30, 30, 30));
        it.rectangle(8, 36, 224, 248, cyan);
        it.print(16, 48, id(font20), white, "Prime fire box (empty).");
        it.print(16, 68, id(font20), muted, "Traeger empty hopper:");
        it.print(16, 88, id(font20), muted, "~320s auger + 30s");
        it.print(16, 108, id(font20), muted, "pellets = 350s typical.");
        it.print(16, 132, id(font20), white, "How long to prime?");
        it.filled_rectangle(14, 196, 68, 40, cyan);
        it.rectangle(14, 196, 68, 40, white);
        it.print(30, 206, id(font20), white, "90s");
        it.filled_rectangle(86, 196, 68, 40, cyan);
        it.rectangle(86, 196, 68, 40, white);
        it.print(96, 206, id(font20), white, "180s");
        it.filled_rectangle(158, 196, 68, 40, cyan);
        it.rectangle(158, 196, 68, 40, white);
        it.print(166, 206, id(font20), white, "350s");
        it.filled_rectangle(85, 252, 70, 32, muted);
        it.rectangle(85, 252, 70, 32, white);
        it.print(96, 258, id(font20), white, "Cancel");
        return;
      }

      it.filled_rectangle(0, 0, 240, 320, bg);

      if (id(cs1pot_ui_page) != 0) {
        it.filled_rectangle(0, 0, 240, 28, card);
        it.filled_rectangle(2, 2, 44, 24, Color(28, 28, 30));
        it.print(12, 4, id(font20), cyan, "<");
        it.print(52, 6, id(font20), white, "Settings");
        it.print(kPad, 48, id(font14), white, "Tune via Home Assistant");
        it.print(kPad, 68, id(font12), muted, "or ESPHome dashboard.");
        it.print(kPad, 92, id(font12), muted, "On-grill: cook + manual");
        it.print(kPad, 108, id(font12), muted, "Auger / Hotrod / Prime.");
        it.filled_rectangle(0, kStatusY, 240, 2, cyan);
        it.filled_rectangle(0, kStatusY + 2, 240, kStatusH - 2, card);
        const char *st = id(status_msg).state.c_str();
        it.print(cook_status_center_x(st, 7), kStatusY + 10, id(font14), white, st);
        return;
      }

      const bool on = id(go).state;
      const bool heat = on && (id(cook_mode).state == "Heat");
      const bool smoke = on && (id(cook_mode).state == "Smoke");

      auto mode_btn = [&](int x, bool active, const char *label) {
        cook_draw_round_btn(it, x, kModeY, kModeW, kModeH, active, amber, muted, white, Color(0, 0, 0));
        int tx = x + (kModeW - (int) strlen(label) * 7) / 2;
        if (tx < x + 4) tx = x + 4;
        it.print(tx, kModeY + 7, id(font14), active ? Color(0, 0, 0) : white, label);
      };
      mode_btn(kModeOffX, !on, "OFF");
      mode_btn(kModeHeatX, heat, "Heat");
      mode_btn(kModeSmokeX, smoke, "Smoke");
      cook_draw_round_btn(it, kGearX, kModeY, kGearW, kModeH, false, amber, muted, white, white);
      cook_draw_gear(it, kGearX + kGearW / 2, kModeY + kModeH / 2, white);

      float chamber = id(rtd_temperature_f).state;
      if (!isnan(chamber)) {
        char buf[8];
        snprintf(buf, sizeof(buf), "%.0f", chamber);
        int tx = 120 - (int) strlen(buf) * 14;
        if (tx < 8) tx = 8;
        it.print(tx, kChamberNumY, id(font_chamber), amber, buf);
      } else {
        it.print(96, kChamberNumY, id(font_chamber), muted, "--");
      }
      it.print(72, kChamberLblY, id(font12), muted, "F CHAMBER");

      float fp = NAN;
      if (id(firepot_temperature_f).has_state())
        fp = id(firepot_temperature_f).state;
      if (!isnan(fp)) {
        it.printf(72, kFirepotY, id(font14), cook_firepot(), "FirePot %.0fF", fp);
      } else {
        it.print(84, kFirepotY, id(font14), cook_firepot(), "FirePot --F");
      }

      it.filled_rectangle(kSetMinusX, kSetRowY, kSetBtnW, kSetRowH, card);
      it.rectangle(kSetMinusX, kSetRowY, kSetBtnW, kSetRowH, cyan);
      cook_draw_minus(it, kSetMinusX + kSetBtnW / 2, kSetRowY + kSetRowH / 2, white);
      it.filled_rectangle(kSetCenterX, kSetRowY, kSetCenterW, kSetRowH, card);
      it.rectangle(kSetCenterX, kSetRowY, kSetCenterW, kSetRowH, cyan);
      it.print(kSetCenterX + 46, kSetRowY + 4, id(font12), muted, "SET");
      it.printf(kSetCenterX + 28, kSetRowY + 16, id(font22), white, "%.0fF", id(smoker_set_temp).state);
      it.filled_rectangle(kSetPlusX, kSetRowY, kSetBtnW, kSetRowH, card);
      it.rectangle(kSetPlusX, kSetRowY, kSetBtnW, kSetRowH, cyan);
      cook_draw_plus(it, kSetPlusX + kSetBtnW / 2, kSetRowY + kSetRowH / 2, white);

      it.print(102, kSmokeRowY - 10, id(font12), muted, "SMOKE");
      int sel_pill = 1;
      auto idx = id(p_select).index_of(id(p_select).state);
      if (idx.has_value()) {
        int pi = (int) idx.value();
        if (pi >= 1 && pi <= 5)
          sel_pill = pi;
        else if (pi == 0)
          sel_pill = 1;
      }
      for (int pill = 1; pill <= 5; pill++) {
        int px = cook_smoke_pill_x(pill);
        bool active = (pill == sel_pill);
        cook_draw_round_btn(it, px, kSmokeRowY, kSmokePillW, kSmokeRowH, active, amber, muted, white, Color(0, 0, 0));
        char digit[2];
        digit[0] = '0' + pill;
        digit[1] = '\0';
        it.print(px + 14, kSmokeRowY + 6, id(font14), active ? Color(0, 0, 0) : white, digit);
      }

      it.filled_rectangle(kGraphCardX, kGraphCardY, kGraphCardW, kGraphCardH, card);
      it.rectangle(kGraphCardX, kGraphCardY, kGraphCardW, kGraphCardH, muted);
      it.print(kGraphCardX + 6, kGraphCardY + 4, id(font12), muted, "Chamber 120m");
      it.filled_rectangle(kGraphPlotX, kGraphPlotY, kGraphPlotW, kGraphPlotH, Color(24, 24, 24));
      const int win_min = kHomeGraphWindowMin;
      int pan = hist_clamp_pan(win_min, id(graph_time_pan));
      id(graph_time_pan) = pan;
      int n = hist_window_samples(win_min);
      if (n > 1) {
        float ymin = hist_min_visible(win_min, pan);
        float ymax = hist_max_visible(win_min, pan);
        if (isnan(ymin) || isnan(ymax) || ymax - ymin < 5.0f) {
          ymin = (isnan(chamber) ? 200.0f : chamber) - 10.0f;
          ymax = (isnan(chamber) ? 220.0f : chamber) + 10.0f;
        }
        ymin -= 8.0f;
        ymax += 8.0f;
        float span = ymax - ymin;
        if (span < 5.0f) span = 5.0f;
        int prev_x = -1, prev_y = -1;
        for (int i = 0; i < n; i++) {
          float v = hist_get(hist_age_for_slot(pan, n, i));
          if (isnan(v)) continue;
          int x = kGraphPlotX + 1 + (i * (kGraphPlotW - 2) / (n - 1));
          int y = kGraphPlotY + kGraphPlotH - 1 - (int) ((v - ymin) / span * (kGraphPlotH - 2));
          if (prev_x >= 0) it.line(prev_x, prev_y, x, y, amber);
          prev_x = x; prev_y = y;
        }
      }

      float pellet_pct = id(pellet_level_pct).state;
      it.filled_rectangle(kPelletBarX, kPelletY, kPelletBarW, kPelletH, card);
      it.rectangle(kPelletBarX, kPelletY, kPelletBarW, kPelletH, muted);
      it.print(kPelletBarX + 6, kPelletY + 4, id(font12), muted, "PELLETS");
      if (!isnan(pellet_pct)) {
        it.printf(kPelletBarX + kPelletBarW - 44, kPelletY + 4, id(font12), muted, "%.0f%%", pellet_pct);
        int fill_w = (int) ((kPelletBarW - 16) * pellet_pct / 100.0f);
        if (fill_w < 0) fill_w = 0;
        if (fill_w > kPelletBarW - 16) fill_w = kPelletBarW - 16;
        it.filled_rectangle(kPelletBarX + 8, kPelletY + 14, fill_w, 6, amber);
        it.rectangle(kPelletBarX + 8, kPelletY + 14, kPelletBarW - 16, 6, muted);
      } else {
        it.print(kPelletBarX + kPelletBarW - 36, kPelletY + 4, id(font12), muted, "--%");
        it.rectangle(kPelletBarX + 8, kPelletY + 14, kPelletBarW - 16, 6, muted);
      }

      bool aug_on = id(auger_1_sw).state;
      bool rod_on = id(hotrod_1_sw).state;
      bool priming = id(prime_active);
      cook_draw_manual(it, id(font14), kAugerX, kManY, kManW, kManH, aug_on, Color(34, 197, 94), "Auger", 10);
      cook_draw_manual(it, id(font14), kHotrodX, kManY, kManW, kManH, rod_on, Color(239, 68, 68), "Hotrod", 6);
      cook_draw_manual(it, id(font14), kPrimeX, kManY, kManW, kManH, priming, cyan, "Prime", 12);

      it.filled_rectangle(0, kStatusY, 240, 2, cyan);
      it.filled_rectangle(0, kStatusY + 2, 240, kStatusH - 2, card);
      const char *st = id(status_msg).state.c_str();
      it.print(cook_status_center_x(st, 7), kStatusY + 10, id(font14), white, st);

font:
  - file: "gfonts://Roboto"
    id: font_chamber
    size: 48
  - file: "gfonts://Roboto"
    id: font22
    size: 22
  - file: "gfonts://Roboto"
    id: font20
    size: 20
  - file: "gfonts://Roboto"
    id: font14
    size: 14
  - file: "gfonts://Roboto"
    id: font12
    size: 12
