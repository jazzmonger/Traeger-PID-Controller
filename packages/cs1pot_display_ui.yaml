# Main-cook home screen (240x320) — neon cyan mock (Jeff v2)
display:
  - id: !extend mydisplay
    update_interval: 250ms
    lambda: |-
      using namespace cs1pot;

      const Color cyan = neon_cyan();
      const Color white = cook_white();
      const Color muted = cook_muted();
      const Color card = cook_card();

      if (id(lighting_failed_dialog)) {
        it.filled_rectangle(0, 0, 240, 320, Color(0, 0, 0));
        it.filled_rectangle(8, 70, 224, 190, Color(30, 30, 30));
        it.rectangle(8, 70, 224, 190, cook_firepot());
        auto msg_color = ((millis() / 500) % 2 == 0) ? cook_firepot() : white;
        it.print(18, 95, id(font20), msg_color, "Lighting failed,");
        it.print(18, 120, id(font20), msg_color, "are pellets loaded?");
        it.filled_rectangle(70, 210, 100, 40, cyan);
        it.rectangle(70, 210, 100, 40, white);
        it.print(100, 218, id(font20), white, "OK");
        return;
      }

      if (id(prime_confirm_dialog)) {
        it.filled_rectangle(0, 0, 240, 320, Color(0, 0, 0));
        it.filled_rectangle(8, 36, 224, 248, Color(30, 30, 30));
        it.rectangle(8, 36, 224, 248, cyan);
        it.print(16, 48, id(font20), white, "Prime fire box (empty).");
        it.print(16, 68, id(font20), muted, "Traeger empty hopper:");
        it.print(16, 88, id(font20), muted, "~320s auger + 30s");
        it.print(16, 108, id(font20), muted, "pellets = 350s typical.");
        it.print(16, 132, id(font20), white, "How long to prime?");
        it.filled_rectangle(14, 196, 68, 40, cyan);
        it.rectangle(14, 196, 68, 40, white);
        it.print(30, 206, id(font20), white, "90s");
        it.filled_rectangle(86, 196, 68, 40, cyan);
        it.rectangle(86, 196, 68, 40, white);
        it.print(96, 206, id(font20), white, "180s");
        it.filled_rectangle(158, 196, 68, 40, cyan);
        it.rectangle(158, 196, 68, 40, white);
        it.print(166, 206, id(font20), white, "350s");
        it.filled_rectangle(85, 252, 70, 32, muted);
        it.rectangle(85, 252, 70, 32, white);
        it.print(96, 258, id(font20), white, "Cancel");
        return;
      }

      cook_fill_bg_gradient(it);

      if (id(cs1pot_ui_page) != 0) {
        it.filled_rectangle(0, 0, 240, 28, card);
        it.print(12, 4, id(font20), cyan, "<");
        it.print(52, 6, id(font20), white, "Settings");
        it.print(kPad, 48, id(font14), white, "Tune via Home Assistant");
        it.print(kPad, 68, id(font12), muted, "or ESPHome dashboard.");
        it.filled_rectangle(0, kStatusY, 240, 2, cyan);
        const char *st = id(status_msg).state.c_str();
        it.print(cook_status_center_x(st, 7), kStatusY + 6, id(font12), white, st);
        return;
      }

      const bool on = id(go).state;
      const bool heat = on && (id(cook_mode).state == "Heat");
      const bool smoke = on && (id(cook_mode).state == "Smoke");

      cook_draw_mode_tab(it, id(font14), kModeOffX, kModeY, "OFF", !on);
      cook_draw_mode_tab(it, id(font14), kModeHeatX, kModeY, "Heat", heat);
      cook_draw_mode_tab(it, id(font14), kModeSmokeX, kModeY, "SMOKE", smoke);
      cook_draw_gear(it, kGearX, kGearY + 8, muted);

      float chamber = id(rtd_temperature_f).state;
      float set_f = id(smoker_set_temp).state;
      cook_draw_chamber_gauge(it, chamber, set_f);

      if (!isnan(chamber)) {
        it.printf(78, kChamberTempY, id(font_chamber), white, "%.0fF", chamber);
      } else {
        it.print(96, kChamberTempY, id(font_chamber), muted, "--F");
      }
      it.print(58, kChamberLblY, id(font12), cyan, "CURRENT CHAMBER");

      float fp = NAN;
      if (id(firepot_temperature_f).has_state())
        fp = id(firepot_temperature_f).state;
      if (!isnan(fp)) {
        it.printf(72, kFirepotY, id(font14), cook_firepot(), "FirePot %.0fF", fp);
      } else {
        it.print(84, kFirepotY, id(font14), cook_firepot(), "FirePot --F");
      }

      cook_draw_circle_btn(it, kSetMinusCx, kSetRowCy, kSetCircleR, true);
      cook_draw_circle_btn(it, kSetPlusCx, kSetRowCy, kSetCircleR, false);
      it.print(72, kSetRowCy - 6, id(font12), white, "SET");
      it.printf(98, kSetRowCy - 8, id(font22), white, "%.0fF", set_f);

      it.print(78, kSmokeLabelY, id(font14), white, "Smoke Level");
      int sel_pill = 1;
      auto idx = id(p_select).index_of(id(p_select).state);
      if (idx.has_value()) {
        int pi = (int) idx.value();
        if (pi >= 1 && pi <= 5)
          sel_pill = pi;
        else if (pi == 0)
          sel_pill = 1;
      }
      for (int pill = 1; pill <= 5; pill++) {
        cook_draw_smoke_pill(it, id(font14), cook_smoke_pill_x(pill), kSmokeRowY, kSmokePillW, kSmokePillH, pill,
                             pill == sel_pill);
      }

      it.filled_rectangle(kCardX, kCardY, kCardW, kCardH, card);
      it.rectangle(kCardX, kCardY, kCardW, kCardH, track_grey());
      it.print(kCardX + 8, kCardY + 6, id(font12), cyan, "Chamber 120m");
      it.filled_rectangle(kGraphPlotX, kGraphPlotY, kGraphPlotW, kGraphPlotH, Color(6, 8, 10));
      for (int gx = kGraphPlotX + 8; gx < kGraphPlotX + kGraphPlotW; gx += 24)
        it.line(gx, kGraphPlotY + 2, gx, kGraphPlotY + kGraphPlotH - 2, Color(28, 32, 38));
      for (int gy = kGraphPlotY + 6; gy < kGraphPlotY + kGraphPlotH; gy += 8)
        it.line(kGraphPlotX + 2, gy, kGraphPlotX + kGraphPlotW - 2, gy, Color(28, 32, 38));

      const int win_min = kHomeGraphWindowMin;
      int pan = hist_clamp_pan(win_min, id(graph_time_pan));
      id(graph_time_pan) = pan;
      int n = hist_window_samples(win_min);
      if (n > 1) {
        float ymin = hist_min_visible(win_min, pan);
        float ymax = hist_max_visible(win_min, pan);
        if (isnan(ymin) || isnan(ymax) || ymax - ymin < 5.0f) {
          ymin = (isnan(chamber) ? 200.0f : chamber) - 10.0f;
          ymax = (isnan(chamber) ? 220.0f : chamber) + 10.0f;
        }
        ymin -= 8.0f;
        ymax += 8.0f;
        float span = ymax - ymin;
        if (span < 5.0f) span = 5.0f;
        int prev_x = -1, prev_y = -1;
        for (int i = 0; i < n; i++) {
          float v = hist_get(hist_age_for_slot(pan, n, i));
          if (isnan(v)) continue;
          int x = kGraphPlotX + 1 + (i * (kGraphPlotW - 2) / (n - 1));
          int y = kGraphPlotY + kGraphPlotH - 1 - (int) ((v - ymin) / span * (kGraphPlotH - 2));
          if (prev_x >= 0) {
            it.line(prev_x, prev_y, x, y, neon_glow());
            it.line(prev_x, prev_y, x, y, cyan);
          }
          prev_x = x; prev_y = y;
        }
      }

      it.line(kCardX + 8, kCardY + 44, kCardX + kCardW - 8, kCardY + 44, track_grey());
      float pellet_pct = id(pellet_level_pct).state;
      it.print(kCardX + 8, kCardY + 50, id(font12), cyan, "PELLETS");
      if (!isnan(pellet_pct)) {
        it.printf(kCardX + kCardW - 44, kCardY + 50, id(font12), white, "%.0f%%", pellet_pct);
        int bar_w = kCardW - 24;
        int fill_w = (int) (bar_w * pellet_pct / 100.0f);
        if (fill_w < 0) fill_w = 0;
        if (fill_w > bar_w) fill_w = bar_w;
        it.filled_rectangle(kCardX + 12, kPelletBarY, bar_w, kPelletBarH, track_grey());
        if (fill_w > 0) {
          it.filled_rectangle(kCardX + 12, kPelletBarY - 1, fill_w, kPelletBarH + 2, neon_glow_soft());
          it.filled_rectangle(kCardX + 12, kPelletBarY, fill_w, kPelletBarH, cyan);
        }
      } else {
        it.print(kCardX + kCardW - 40, kCardY + 50, id(font12), white, "--%");
        it.filled_rectangle(kCardX + 12, kPelletBarY, kCardW - 24, kPelletBarH, track_grey());
      }

      bool aug_on = id(auger_1_sw).state;
      bool rod_on = id(hotrod_1_sw).state;
      bool priming = id(prime_active);
      cook_draw_pill_manual(it, id(font14), kAugerX, kManY, kManW, kManH, aug_on, "Auger", 10);
      cook_draw_pill_manual(it, id(font14), kHotrodX, kManY, kManW, kManH, rod_on, "Hotrod", 6);
      cook_draw_pill_manual(it, id(font14), kPrimeX, kManY, kManW, kManH, priming, "Prime", 12);

      it.filled_rectangle(0, kStatusY, 240, 1, neon_glow_soft());
      it.filled_rectangle(0, kStatusY + 1, 240, 1, cyan);
      const char *st = id(status_msg).state.c_str();
      it.print(cook_status_center_x(st, 6), kStatusY + 6, id(font12), white, st);

font:
  - file: "gfonts://Roboto"
    id: font_chamber
    size: 40
  - file: "gfonts://Roboto"
    id: font22
    size: 22
  - file: "gfonts://Roboto"
    id: font20
    size: 20
  - file: "gfonts://Roboto"
    id: font14
    size: 14
  - file: "gfonts://Roboto"
    id: font12
    size: 12
